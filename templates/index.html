<!DOCTYPE html>
<html>
<head>
    <title>Guessing Game</title>

    <style>
        body{
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 50px;
        }

        .box{
            background: white;
            width: 420px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        .grid{
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-top: 20px;
        }

        button{
            padding: 8px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #e0e0e0;
        }

        button:hover{
            background: #c0c0c0;
        }

        .clicked{
            background: orange !important;
            color: white;
        }

        .info{
            margin-top: 10px;
        }

        input{
            padding: 8px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Guess The Number</h1>

    <p>{{ message }}</p>

    <div class="info">
        <p>Guesses: {{ guesses }}</p>
        <p>Best Score: {{ best }}</p>
    </div>

    {% if show_name_input %}
        <form action="/save_name" method="POST">
            <input type="text" name="name" placeholder="Enter your name" required>
            <button type="submit">Save</button>
        </form>
    {% endif %}

    <form method="POST">
        <div class="grid">
            {% for i in range(1, 101) %}
                <button type="submit"
                        name="guess"
                        value="{{ i }}"
                        class="{% if i in clicked %}clicked{% endif %}">
                    {{ i }}
                </button>
            {% endfor %}
        </div>
    </form>

</div>

</body>
</html>
