<!DOCTYPE html>
<html>
<head>
    <title>Guessing Game</title>

    <style>

        body{
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 100px;
        }

        .box{
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        input{
            padding: 10px;
            width: 80%;
            margin-top: 10px;
        }

        button{
            padding: 10px 20px;
            margin-top: 15px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Guess The Number</h1>

        <p>Enter a number between 1 and 100</p>

        <form method="POST">

            <input type="number" name="guess" required>

            <br>

            <button type="submit">
                Guess
            </button>

        </form>

        <h3>{{ message }}</h3>

    </div>

</body>
</html>
