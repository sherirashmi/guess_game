<!DOCTYPE html>
<html>
<head>
    <title>Guessing Game</title>

    <style>
        body{
            font-family: Arial;
            background-color: #f2f2f2;
            text-align: center;
            margin-top: 50px;
        }

        .box{
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        .grid{
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-top: 20px;
        }

        button{
            padding: 10px;
            cursor: pointer;
            border: none;
            background: #e0e0e0;
            border-radius: 5px;
        }

        button:hover{
            background: #c0c0c0;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Guess The Number</h1>
    <p>Click a number between 1 and 100</p>

    <form method="POST">
        <div class="grid">
            {% for i in range(1, 101) %}
                <button type="submit" name="guess" value="{{ i }}">
                    {{ i }}
                </button>
            {% endfor %}
        </div>
    </form>

    <h3>{{ message }}</h3>

</div>

</body>
</html>
